app-id: com.google.Chromium
runtime: org.freedesktop.Platform
runtime-version: 20.08beta
sdk: org.freedesktop.Sdk
command: /app/chrome/chrome
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=x11
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.UPower
  - --talk-name=org.gnome.SessionManager
  - --filesystem=home
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

add-extensions:
  com.google.Chromium.NativeMessagingHost:
    version: '1'
    directory: native-messaging-hosts
    merge-dirs: manifest
    subdirectories: true
    no-autodownload: true
    autodelete: true

# The files are manually added in create_flatpak_bundle.py to avoid repeated, slow copying.
modules:
  # Based on https://github.com/flathub/shared-modules/blob/master/python2.7/python-2.7.json
  - name: python2
    config-opts:
      - --enable-shared
      - --with-ensurepip=yes
      - --with-system-expat
      - --with-system-ffi
      - --with-dbmliborder=gdbm
      - --enable-unicode=ucs4
    build-options:
      no-debuginfo: true
    post-install:
      - chmod 644 $FLATPAK_DEST/lib/libpython2.7.so.1.0
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tar.xz
        sha256: b62c0e7937551d0cc02b8fd5cb0f544f9405bafc9a54d3808ed4594812edef43

  - name: libsecret
    config-opts:
      - --enable-shared
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.gnome.org/pub/GNOME/sources/libsecret/0.18/libsecret-0.18.8.tar.xz
        sha256: 3bfa889d260e0dbabcf5b9967f2aae12edcd2ddc9adc365de7a5cc840c311d15

  - name: xcbproto
    build-options:
      env:
        PYTHON: /app/bin/python2
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/proto/xcb-proto-1.14.tar.xz
        sha256: 186a3ceb26f9b4a015f5a44dcc814c93033a5fc39684f36f1ecc79834416a605

  - name: krb5
    subdir: src
    config-opts:
      - --disable-static
      - --disable-rpath
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.18/krb5-1.18.2.tar.gz
        sha256: c6e4c9ec1a98141c3f5d66ddf1a135549050c9fab4e9a4620ee9b22085873ae0

  - name: krb5-config
    buildsystem: simple
    build-commands:
      - install -Dm 644 krb5.conf -t /app/etc
    sources:
      - type: file
        path: krb5.conf

  - name: env
    buildsystem: simple
    build-commands:
      - install -d /app/native-messaging-hosts
      - install -Dm 755 buildenv.sh -t /app
    sources:
      - type: script
        dest-filename: buildenv.sh
        commands:
          - export CC=clang
          - export CXX=clang++
          - export AR=ar
          - export NM=nm
          - export CFLAGS='-Wno-unknown-warning-option -Wno-unknown-pragmas'
          - export CXXFLAGS="$CFLAGS"
    cleanup:
      - '*'

  - name: chrome
    buildsystem: simple
    build-options:
      build-args:
        - --filesystem=home
    build-commands:
      - mkdir -p /app/chrome
      - |
        . $PWD/paths.sh
        cd $BUILD_ROOT
        cp -rv --reflink=auto "${PATHS[@]}" /app/chrome
    sources:
      - type: file
        path: paths.sh
